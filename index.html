<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<meta name="description" content="Autorregistro ABC: antecedente, pensamientos y consecuencias, para revisarlo con tu psicólogo.">
<title>Registro ABC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#11141a; --card:#191d25; --card2:#212631; --line:#2c3340; --text:#e8ecf2; --muted:#949eae;
  --acc:#8fb0ff; --acc-ink:#8fb0ff; --on-acc:#0c1630; --lo:#7fa8d9; --mid:#b9a2e8; --hi:#f2b47e; --danger:#ff8a7a;
  --radius:18px; --shadow:0 8px 30px rgba(0,0,0,.35); --toast-link:#3d64c8;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f7; --card:#ffffff; --card2:#eceef3; --line:#dcdfe6; --text:#161a22; --muted:#5f6878;
    --acc:#3d64c8; --acc-ink:#3d64c8; --on-acc:#ffffff; --lo:#3f73b0; --mid:#7a5cc4; --hi:#a8601a; --danger:#c43c2c;
    --shadow:0 6px 24px rgba(20,30,50,.10); --toast-link:#8fb0ff; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --card:#ffffff; --card2:#eceef3; --line:#dcdfe6; --text:#161a22; --muted:#5f6878;
  --acc:#3d64c8; --acc-ink:#3d64c8; --on-acc:#ffffff; --lo:#3f73b0; --mid:#7a5cc4; --hi:#a8601a; --danger:#c43c2c;
  --shadow:0 6px 24px rgba(20,30,50,.10); --toast-link:#8fb0ff; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.editing{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.editing nav.tabs{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:120px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
input[type=range]{padding:0;border:0;background:none;height:34px;accent-color:var(--acc)}
input[type=range]:focus{outline:none}
.num{font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:16px 16px 24px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 14px}
header.top h1{font-size:22px;margin:0;letter-spacing:-.02em}
header.top .sub{color:var(--muted);font-size:14px}
.navb{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:var(--acc);color:var(--on-acc);border-color:transparent}
.ich{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid currentColor;font-size:13px;font-weight:600;white-space:nowrap}
.ich b{font-weight:800}
.lo{color:var(--lo)} .mid{color:var(--mid)} .hi{color:var(--hi)}
.btn{flex:1;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700;text-align:center}
.btn.pri{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{flex:0 0 auto;padding:9px 12px;font-size:14px}
.btn.big{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;font-size:18px;border-radius:18px}
.actions{display:flex;gap:8px;margin-top:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--on-acc)}
h3.sec{display:flex;justify-content:space-between;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 2px 8px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:14px}
/* tarjetas de registro */
.ecard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.ecard .eh{display:flex;gap:10px;align-items:flex-start}
.ecard .et{font-weight:800;font-size:16px;min-width:46px;padding-top:1px}
.ecard .emos{display:flex;gap:6px;flex-wrap:wrap}
.ecard .ea{margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ecard .eb{margin-top:4px;color:var(--muted);font-style:italic;font-size:14px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.L{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:16px;margin-right:8px;flex:0 0 auto}
.abc{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.abc li{display:flex;align-items:flex-start;font-size:14px}
/* editor */
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps button{flex:1;padding:8px 4px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.steps button b{font-size:18px;color:var(--text)}
.steps button.on{border-color:var(--acc);color:var(--text);box-shadow:inset 0 -3px 0 var(--acc)}
.steps button.ok b::after{content:" ✓";color:var(--acc-ink);font-size:14px}
h2.q{display:flex;align-items:center;font-size:20px;margin:18px 0 4px;letter-spacing:-.01em}
h2.q:first-child{margin-top:4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.sl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px 4px;margin-top:8px}
.sl .row{justify-content:space-between}
.sl .v{font-size:22px;font-weight:800}
.sl .ticks{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:-4px;padding-bottom:4px}
.sl .rm{color:var(--muted);font-size:13px;font-weight:700;padding:4px 0}
.edfoot{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.edfoot .in{max-width:528px;margin:0 auto;display:flex;gap:8px}
/* detalle */
.dsec{margin-top:14px}
.dsec .dl{display:flex;align-items:center;font-weight:700;margin-bottom:6px}
.dsec p{margin:0 0 0 38px;white-space:pre-wrap;overflow-wrap:anywhere}
.dsec .chips{margin-left:38px}
.dsec .ttl{margin:8px 0 4px 38px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
/* resumen */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hero .lbl{color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.hb{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.hb .bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.hb .bar i.lo{background:var(--lo)} .hb .bar i.mid{background:var(--mid)} .hb .bar i.hi{background:var(--hi)}
.hb .r{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.vbars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px}
.vbars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.vbars i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:2px}
.vbars span{font-size:10px;color:var(--muted);white-space:nowrap}
.vbars em{font-style:normal;font-size:11px;font-weight:700}
/* hojas, pestañas, avisos */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--text);background:var(--card)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .18s ease}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:6px}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.stack{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.opt .d{color:var(--muted);font-size:13px}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.note{border-left:4px solid var(--hi);background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:20;box-shadow:var(--shadow);animation:up .2s;width:max-content;max-width:calc(100vw - 32px);text-align:center}
.toast button{color:var(--toast-link);font-weight:800;margin-left:10px}
details summary{cursor:pointer;font-weight:700}
main:has(>.crisis){display:flex;flex-direction:column;min-height:calc(100dvh - 84px - env(safe-area-inset-bottom))}
.card.pend{border-color:var(--hi)}
.card.pend .opt{margin-top:6px;flex-direction:column;align-items:flex-start;gap:2px}
.card.pend .pa{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ecard .falta{margin-top:8px;font-size:12px;font-weight:700;color:var(--hi)}
.ht{flex:1;min-width:0}
body.nonav{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.nonav nav.tabs{display:none}
body.nonav main:has(>.crisis){min-height:calc(100dvh - 24px - env(safe-area-inset-bottom))}
.acc{color:var(--acc)}
/* inicio */
.aviso{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--hi);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.aviso span{color:var(--hi);font-weight:700;font-size:14px;white-space:nowrap}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:150px}
.tool b{font-size:16px;line-height:1.25}
.tool>span:last-child{color:var(--muted);font-size:13px;line-height:1.35}
.tool.soon{opacity:.5}
.ic-abc{font-weight:800;font-size:14px;letter-spacing:.05em;color:var(--on-acc);background:var(--acc);border-radius:12px;padding:9px 10px;margin-bottom:4px}
.ic-resp{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--lo) 28%,transparent);display:grid;place-items:center;margin-bottom:4px}
.ic-resp i{width:20px;height:20px;border-radius:50%;background:var(--lo)}
.ic-soon{font-size:12px;font-weight:800;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:9px 10px;margin-bottom:4px}
/* respiración */
.tec{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
.tec-ic{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,currentColor 20%,transparent)}
.tec-ic i{width:20px;height:20px;border-radius:50%;background:currentColor}
.tec-t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tec-t span{color:var(--muted);font-size:13px}
.tec-t .tec-m{font-size:12px}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.rrow:first-child{border-top:0}
.rrow span:first-child{color:var(--muted);white-space:nowrap}
.rrow span:last-child{text-align:right}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale button{padding:10px 0;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.scale button.on{background:var(--acc);color:var(--on-acc);border-color:transparent}
.info p{margin:10px 0 0}
.br{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.br.dim{background:#06080b;--text:#7f8896;--muted:#555d69;--line:#1b2028;--card2:#12161c;color:var(--text)}
.br.dim svg circle{stroke-opacity:.55}
.br-top{display:flex;justify-content:space-between;align-items:center;max-width:560px;width:100%;margin:0 auto}
.br-top .t{font-weight:700;color:var(--muted);font-size:15px}
.br-stage{flex:1;display:grid;place-items:center;min-height:0}
.br-stage svg{width:min(84vw,50vh,420px);height:auto;overflow:visible}
.br-stage svg text{font:800 46px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--text);font-variant-numeric:tabular-nums}
.br-txt{height:84px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:0 20px}
.br-txt b{font-size:32px;letter-spacing:-.02em}
.br-txt span{color:var(--muted);font-size:15px}
.br-bot{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.br-end{max-width:528px;margin:auto;width:100%}
.crisis{color:var(--muted);font-size:11.5px;text-align:center;margin:auto 8px 0;padding-top:28px;opacity:.85}
.crisis a{color:inherit;font-weight:700}
/* anclaje */
.ic-anc{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--hi) 24%,transparent);display:grid;place-items:center;margin-bottom:4px;font-size:20px;line-height:1}
.linkb{color:var(--acc-ink);font-weight:700;text-decoration:underline;padding:0}
.btn.an-sim{flex-direction:column;gap:2px;margin-top:8px;padding:14px 18px}
.btn.an-sim span{font-size:13px;font-weight:500;color:var(--muted)}
.an-pie{text-align:center;font-size:14px;font-style:italic;color:var(--muted);margin:18px 8px 0;overflow-wrap:anywhere}
.an-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;max-width:560px;width:100%;margin:0 auto;padding:0 8px}
.an-dots{display:flex;gap:8px}
.an-dots i{width:30px;height:5px;border-radius:9px;background:var(--line)}
.an-dots i.on{background:var(--hi)}
.an-paso{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--hi)}
.an-fr{font-size:26px;font-weight:700;line-height:1.35;letter-spacing:-.01em;min-height:5.2em;width:100%;overflow-wrap:anywhere}
.an-fr .w{display:inline-block;white-space:nowrap}
.an-fr .ch{display:inline-block;transform-origin:50% 60%;animation:an-ola .9s ease-in-out both}
@keyframes an-ola{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.toast{animation-name:tup} @keyframes tup{from{transform:translate(-50%,24px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* informe para imprimir / guardar como PDF */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  html,body{background:#fff!important;color:#000!important;padding:0!important}
  main,nav.tabs,#sheet-root,.toast,.edfoot{display:none!important}
  #print{display:block;font-size:9.5pt;line-height:1.35;color:#000}
  #print h1{font-size:16pt;margin:0 0 4px}
  #print h2{font-size:11.5pt;margin:14px 0 6px}
  #print .meta{color:#333;margin-bottom:6px}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top;white-space:pre-wrap;overflow-wrap:anywhere}
  #print th{background:#eee}
  #print table.rs{width:auto;min-width:50%}
  #print table.rs td.n{text-align:right}
  #print tr{break-inside:avoid}
  #print .foot{margin-top:10px;color:#555;font-size:8pt}
}
</style>

<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-tab="registrar"><span class="ic">✍️</span>Registrar</button>
  <button data-tab="historial"><span class="ic">📖</span>Historial</button>
  <button data-tab="resumen"><span class="ic">📊</span>Resumen</button>
</div></nav>
<div id="sheet-root"></div>
<div id="print"></div>
<script>
'use strict';
const VERSION = 6;
const STORE = 'abc.v1';

/* ===================== Datos ===================== */
const EMOS = ['Ansiedad','Tristeza','Ira','Miedo','Culpa','Vergüenza','Frustración','Soledad','Celos','Asco','Alegría','Calma'];
const FIS = ['Tensión muscular','Palpitaciones','Nudo en el estómago','Falta de aire','Llanto','Temblor','Calor o sudor','Mareo','Cansancio','Dolor de cabeza','Inquietud'];
const PSICO = 'Raúl Triana Guillén'; // psicólogo por defecto: la app es suya
const DEFAULTS = {settings:{nombre:'', psico:PSICO, consulta:'', theme:'auto', resp:{dur:{}, ritmo:{}, son:{}, vib:true}, anc:{nombre:'', vib:true, preg:false}}, entries:[], draft:null, resp:[], anc:[]};
// Una práctica de respiración: {id, at (ms), tec, seg (segundos hechos), antes, despues (tensión 0–10 o null)}
// Una entrada: {id, at (ms), a, b, emo:[{n, i 0–10}], fis:[…], fisTxt, cond, cp, lp, cre, upd}
// cp y lp: qué pasó después de la conducta, a corto y a largo plazo (desde la v2)
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ S = {}; }
  S = Object.assign(structuredClone(DEFAULTS), S);
  S.settings = Object.assign(structuredClone(DEFAULTS.settings), S.settings);
  if (!Array.isArray(S.entries)) S.entries = [];
  if (!Array.isArray(S.resp)) S.resp = [];
  if (!Array.isArray(S.anc)) S.anc = [];
  S.settings.anc = Object.assign(structuredClone(DEFAULTS.settings.anc), S.settings.anc);
  S.settings.resp = Object.assign(structuredClone(DEFAULTS.settings.resp), S.settings.resp);
  if (!S.settings.psico) S.settings.psico = PSICO; // las versiones 1 y 2 lo dejaban vacío
  for (const e of S.entries.concat(S.draft ? [S.draft.data] : [])){ e.cp = e.cp || ''; e.lp = e.lp || ''; }
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(S)); return true; }
  catch(e){ toast('No se ha podido guardar: el almacenamiento del móvil está lleno'); return false; }
}

/* ===================== Utilidades ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const pad = n => String(n).padStart(2, '0');
const DAY_MS = 86400e3;
const DAYS_LONG = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONTHS_LONG = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap = s => s[0].toUpperCase() + s.slice(1);
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// El día de la app empieza a las 05:00: lo de madrugada cuenta en el día anterior
function dayKey(ms = Date.now()){ const x = new Date(ms - 5*3600e3); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); }
function keyToDate(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d, 12); }
function addDays(k, n){ const d = keyToDate(k); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekStart(k){ return addDays(k, -((keyToDate(k).getDay() + 6) % 7)); }
function dayTitle(k){
  const t = dayKey(); if (k === t) return 'Hoy'; if (k === addDays(t, -1)) return 'Ayer';
  const d = keyToDate(k);
  return cap(DAYS_LONG[d.getDay()]) + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
const hhmm = ms => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const dmy = ms => { const d = new Date(ms); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };
const longDate = ms => { const d = new Date(ms); return cap(DAYS_LONG[d.getDay()]) + ' ' + d.getDate() + ' de ' + MONTHS_LONG[d.getMonth()] + ' de ' + d.getFullYear(); };
const dateVal = ms => { const d = new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const toLocalInput = ms => dateVal(ms) + 'T' + hhmm(ms);
const fromLocalInput = s => { const t = new Date(s).getTime(); return isFinite(t) ? t : null; };
function fromDateVal(s, end){ if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return null; const [y,m,d] = s.split('-').map(Number); return end ? new Date(y, m-1, d, 23, 59, 59, 999).getTime() : new Date(y, m-1, d).getTime(); }
const dec = n => (Math.round(n * 10) / 10).toLocaleString('es-ES');

const maxI = e => e.emo.reduce((a, x) => Math.max(a, x.i), 0);
const byI = e => e.emo.slice().sort((a, b) => b.i - a.i);
const ilvl = i => i >= 7 ? 'hi' : i >= 4 ? 'mid' : 'lo';
const emoChip = x => `<span class="ich ${ilvl(x.i)}">${esc(x.n)} <b class="num">${x.i}</b></span>`;
const emoTxt = e => byI(e).map(x => x.n + ' ' + x.i).join(', ');
const fisTxt = e => e.fis.join(', ') + (e.fisTxt ? (e.fis.length ? ' · ' : '') + e.fisTxt : '');
const sorted = () => S.entries.slice().sort((a, b) => b.at - a.at);
function inPeriod(list, per){
  if (per === 'all') return list;
  const from = addDays(dayKey(), -(+per - 1));
  return list.filter(e => dayKey(e.at) >= from);
}

function toast(msg, undo){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = esc(msg) + (undo ? ' <button>Deshacer</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
}
function sheet(html, onMount){
  const root = document.getElementById('sheet-root');
  root.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const bg = root.firstChild;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  if (onMount) onMount(bg.querySelector('.sheet'));
}
function closeSheet(){ document.getElementById('sheet-root').innerHTML = ''; }

/* ===================== Navegación ===================== */
// Pantallas: inicio (menú de herramientas) · abc (con sus pestañas) · respirar · anclaje · ajustes.
// Cada pantalla va en el historial (#abc/historial, #respirar…), así el botón Atrás del móvil vuelve al menú.
const TABS = ['registrar','historial','resumen'];
let VIEW = 'inicio', TAB = 'registrar';
let ED = null; // registro que se está escribiendo: {id (null si es nuevo), step, data}
const app = document.getElementById('app');
const BACK = `<button class="navb" data-act="back" aria-label="Volver">‹</button>`;
function render(){
  document.body.classList.toggle('editing', VIEW === 'abc' && !!ED);
  document.body.classList.toggle('nonav', VIEW !== 'abc');
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', !ED && b.dataset.tab === TAB ? 'page' : 'false'));
  if (VIEW === 'abc'){
    if (ED) return renderEditor();
    return ({registrar:renderRegistrar, historial:renderHistorial, resumen:renderResumen})[TAB]();
  }
  ({inicio:renderInicio, respirar:renderRespirar, anclaje:renderAnclaje, ajustes:renderAjustes})[VIEW]();
}
function applyTheme(){ const t = S.settings.theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
function routeFromHash(){
  const [v, t] = location.hash.slice(1).split('/');
  if (TABS.includes(v)){ VIEW = 'abc'; TAB = v; }        // enlaces de la versión 4 (#registrar, #historial…)
  else if (v === 'abc'){ VIEW = 'abc'; TAB = TABS.includes(t) ? t : 'registrar'; }
  else VIEW = ['respirar','anclaje','ajustes'].includes(v) ? v : 'inicio';
}
function go(hash){
  history.pushState({app:1}, '', '#' + hash);
  routeFromHash(); closeSheet(); window.scrollTo(0, 0); render();
}
function goBack(){
  if (history.state && history.state.app) history.back();
  else { history.replaceState(null, '', '#inicio'); routeFromHash(); closeSheet(); window.scrollTo(0, 0); render(); }
}
window.addEventListener('popstate', () => {
  if (BR) brStop();
  if (AN) anStop();
  if (ED && !ED.id && !isBlank(ED.data)) toast('Guardado como borrador');
  if (ED){ if (!ED.id && isBlank(ED.data)){ S.draft = null; save(); } ED = null; }
  routeFromHash(); closeSheet(); window.scrollTo(0, 0); render();
  if (AFTER){ const f = AFTER; AFTER = null; f(); }
});
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => {
  closeSheet(); TAB = b.dataset.tab; history.replaceState(history.state, '', '#abc/' + TAB); window.scrollTo(0, 0); render();
}));

/* ===================== Inicio: menú de herramientas ===================== */
const TOOLS = [
  {id:'abc', n:'Autorregistro', d:'Apunta qué pasó, qué pensaste y cómo te sentiste', ic:'<span class="ic-abc">ABC</span>'},
  {id:'respirar', n:'Respiración guiada', d:'Ejercicios para bajar la tensión, calmarte o dormir', ic:'<span class="ic-resp"><i></i></span>'},
  {id:'anclaje', n:'Anclaje', d:'Para mantenerte en pie cuando aprieta y elegir qué hacer', ic:'<span class="ic-anc">⚓</span>'},
  {id:null, n:'Relajación muscular', d:'Tensar y soltar, paso a paso', ic:'<span class="ic-soon">〰</span>'},
];
function renderInicio(){
  const s = S.settings, h = new Date().getHours(), pend = S.entries.filter(e => lpPending(e)).length;
  const saludo = h >= 5 && h < 14 ? 'Buenos días' : h >= 5 && h < 21 ? 'Buenas tardes' : 'Buenas noches';
  const nombre = s.nombre.trim().split(/\s+/)[0];
  app.innerHTML = `<header class="top"><div class="ht"><h1>${saludo}${nombre ? ', ' + esc(nombre) : ''}</h1><div class="sub">${longDate(Date.now())}</div></div>
      <button class="navb" data-act="go" data-to="ajustes" aria-label="Ajustes">⚙️</button></header>
    ${S.draft ? `<button class="aviso" data-act="go" data-to="abc"><b>Tienes un registro a medias</b><span>Seguir ›</span></button>` : ''}
    ${pend ? `<button class="aviso" data-act="go" data-to="abc"><b>${pend === 1 ? 'Un registro por completar' : pend + ' registros por completar'}</b><span>Ver ›</span></button>` : ''}
    <h3 class="sec"><span>Tus herramientas</span></h3>
    <div class="tools">${TOOLS.map(t => t.id
      ? `<button class="tool" data-act="go" data-to="${t.id}">${t.ic}<b>${t.n}</b><span>${t.d}</span></button>`
      : `<div class="tool soon" aria-disabled="true">${t.ic}<b>${t.n}</b><span>Próximamente</span></div>`).join('')}</div>
    ${CRISIS}`;
}

/* ===================== Registrar ===================== */
function renderRegistrar(){
  const k = dayKey(), hoy = sorted().filter(e => dayKey(e.at) === k).reverse();
  const semana = S.entries.filter(e => dayKey(e.at) >= weekStart(k)).length;
  const d = S.draft, pend = sorted().filter(e => lpPending(e));
  app.innerHTML = `<header class="top">${BACK}<div class="ht"><h1>Autorregistro ABC</h1><div class="sub">${longDate(Date.now())}</div></div>
    ${semana ? `<span class="chip num">${semana} esta semana</span>` : ''}</header>
  ${pend.length ? `<div class="card pend"><b>${pend.length === 1 ? 'Un registro por completar' : pend.length + ' registros por completar'}</b>
      <div class="muted small" style="margin:2px 0 8px">¿Qué pasó después, horas o días más tarde?</div>
      ${pend.slice(0, 5).map(e => `<button class="opt" data-act="lp" data-id="${esc(e.id)}"><span class="pa">${esc(e.a)}</span><span class="d num">${dayTitle(dayKey(e.at))} · ${hhmm(e.at)}</span></button>`).join('')}
      ${pend.length > 5 ? `<div class="muted small" style="margin-top:6px">y ${pend.length - 5} más en el Historial</div>` : ''}</div>` : ''}
  ${d ? `<div class="card"><b>Tienes un registro a medias</b><div class="muted small" style="margin-top:4px">${esc((d.data.a || d.data.b || 'Sin texto todavía').slice(0, 90))}</div>
      <div class="actions"><button class="btn pri" data-act="new">Seguir</button><button class="btn ghost" data-act="discard">Descartar</button></div></div>`
    : `<button class="btn pri big" data-act="new"><span style="font-size:24px">＋</span> Nuevo registro</button>`}
  <details class="card" style="margin-top:12px" ${S.entries.length ? '' : 'open'}><summary>¿Cómo se rellena?</summary>
    <ul class="abc" style="margin-top:12px">
      <li><span class="L">A</span><span><b>Antecedente:</b> lo que lo desencadenó. Algo de fuera (dónde, con quién, qué pasó) o de dentro (un recuerdo, una sensación, una idea). Solo los hechos.</span></li>
      <li><span class="L">B</span><span><b>Pensamientos:</b> lo que te pasó por la cabeza en ese momento, tal cual, en frases.</span></li>
      <li><span class="L">C</span><span><b>Consecuencias:</b> qué sentiste y con qué intensidad (0–10), qué notaste en el cuerpo, qué hiciste y qué pasó después.</span></li>
    </ul>
    <div class="muted small" style="margin-top:10px">Mejor apuntarlo cuanto antes, cuando aún recuerdas lo que pensaste. No hace falta escribir mucho.</div>
  </details>
  <h3 class="sec"><span>Hoy</span><span class="num">${hoy.length || ''}</span></h3>
  ${hoy.length ? hoy.map(entryCard).join('') : `<div class="empty">Aún no hay registros hoy.</div>`}
  ${CRISIS}`;
}
// Discreto, al pie de Registrar y Ajustes
const CRISIS = `<div class="crisis">¿Estás en crisis o piensas en hacerte daño? Llama al <a href="tel:024">024</a> (gratis, 24 h) o al <a href="tel:112">112</a>.</div>`;
function entryCard(e){
  return `<button class="ecard" data-act="open" data-id="${esc(e.id)}"><div class="eh"><span class="et num">${hhmm(e.at)}</span><span class="emos">${byI(e).map(emoChip).join('')}</span></div>
    <div class="ea">${esc(e.a)}</div><div class="eb">«${esc(e.b)}»</div>${lpPending(e) ? '<div class="falta">Falta: qué pasó más adelante</div>' : ''}</button>`;
}

/* ===================== «Más adelante» pendiente ===================== */
// Pasadas 12 h, se pide completar qué pasó más adelante. Solo registros de las últimas 2 semanas y sin «Omitir».
const LP_MIN = 12 * 3600e3, LP_MAX = 14 * DAY_MS;
function lpPending(e, now = Date.now()){ return !e.lp && !e.lpNo && now - e.at >= LP_MIN && now - e.at <= LP_MAX; }
function sheetLp(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  sheet(`<h2>¿Qué pasó después?</h2><div class="sub">${dayTitle(dayKey(e.at))} · ${hhmm(e.at)}</div>
    <div class="dsec" style="margin-top:8px"><div class="dl"><span class="L">A</span>Antecedente</div><p>${nl(e.a)}</p></div>
    ${e.cond ? `<div class="dsec"><div class="ttl" style="margin-top:0">Qué hice</div><p>${nl(e.cond)}</p></div>` : ''}
    ${e.cp ? `<div class="dsec"><div class="ttl" style="margin-top:0">Justo después</div><p>${nl(e.cp)}</p></div>` : ''}
    <label class="f" style="margin-top:16px">Más adelante (horas o días después)</label>
    <textarea id="lp-txt" rows="3" style="min-height:90px" placeholder="¿Qué efecto tuvo después? Ej.: Al día siguiente me daba más miedo hablar con ella."></textarea>
    <div class="actions"><button class="btn ghost" data-act="lp-no" data-id="${esc(e.id)}">Nada que añadir</button><button class="btn pri" data-act="lp-save" data-id="${esc(e.id)}">Guardar</button></div>`,
    el => el.querySelector('#lp-txt').focus());
}
function lpSet(id, fields, msg){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  Object.assign(e, fields, {upd: Date.now()}); save(); closeSheet(); render(); toast(msg);
}

/* ===================== Editor (A → B → C) ===================== */
const blank = () => ({at: Date.now(), a:'', b:'', emo:[], fis:[], fisTxt:'', cond:'', cp:'', lp:''});
const isBlank = d => !d.a.trim() && !d.b.trim() && !d.emo.length && !d.fis.length && !d.fisTxt.trim() && !d.cond.trim() && !d.cp.trim() && !d.lp.trim();
function openEditor(id){
  closeSheet();
  if (id){ const e = S.entries.find(x => x.id === id); if (!e) return; ED = {id, step:0, data:structuredClone(e)}; }
  else if (S.draft) ED = S.draft;
  else { ED = {id:null, step:0, data:blank()}; S.draft = ED; save(); }
  window.scrollTo(0, 0); render();
}
function edChanged(){ if (!ED.id){ S.draft = ED; save(); } }
function closeEditor(){
  if (!ED.id){
    if (isBlank(ED.data)) S.draft = null; else toast('Guardado como borrador');
    save();
  }
  ED = null; window.scrollTo(0, 0); render();
}
const STEPS = [['A','Antecedente'],['B','Pensamientos'],['C','Consecuencias']];
function stepOk(i, d){ return i === 0 ? !!d.a.trim() : i === 1 ? !!d.b.trim() : d.emo.length > 0; }
function renderEditor(){
  const d = ED.data, st = ED.step;
  let body;
  if (st === 0) body = `
    <h2 class="q"><span class="L">A</span>¿Qué lo desencadenó?</h2>
    <p class="hint">Puede ser algo de fuera (dónde estabas, con quién, qué pasó) o de dentro de ti: un recuerdo, una sensación del cuerpo, una idea que te vino. Solo los hechos.</p>
    <textarea data-f="a" rows="6" placeholder="Ej.: En la reunión, mi jefa ha dicho delante de todos que el informe tenía errores. / Estaba en la cama y me vino el recuerdo de la discusión de ayer.">${esc(d.a)}</textarea>
    <label class="f">Cuándo pasó</label><input type="datetime-local" id="ed-at" value="${toLocalInput(d.at)}">`;
  else if (st === 1) body = `
    <h2 class="q"><span class="L">B</span>¿Qué pensaste?</h2>
    <p class="hint">Lo que te pasó por la cabeza en ese momento, tal cual, en primera persona.</p>
    <textarea data-f="b" rows="6" placeholder="Ej.: «Soy un desastre». «Ahora todos piensan que no valgo para esto».">${esc(d.b)}</textarea>
    <div class="note" style="border-left-color:var(--acc)"><b>Pensamiento no es emoción.</b> Un pensamiento es una frase («soy un inútil», «me va a salir mal»); la emoción suele caber en una palabra (tristeza, miedo, rabia) y va en C. «Me sentí inútil» es en realidad un pensamiento: «soy un inútil».</div>`;
  else {
    const names = EMOS.concat(d.emo.map(x => x.n).filter(n => !EMOS.includes(n)));
    body = `
    <h2 class="q"><span class="L">C</span>¿Qué sentiste?</h2>
    <p class="hint">Marca las emociones y cuánto: 0 = nada, 10 = lo máximo que has sentido.</p>
    <div class="chips">${names.map(n => `<button class="chip ${d.emo.some(x => x.n === n) ? 'on' : ''}" data-act="emo" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <div class="row" style="margin-top:8px"><input id="ed-otra" maxlength="30" placeholder="Otra emoción"><button class="btn sm" data-act="emo-add">Añadir</button></div>
    ${d.emo.map((x, i) => `<div class="sl"><div class="row"><b>${esc(x.n)}</b><span><button class="rm" data-act="emo" data-n="${esc(x.n)}" aria-label="Quitar ${esc(x.n)}">Quitar</button> <span class="v num ${ilvl(x.i)}" id="ev${i}">${x.i}</span></span></div>
      <input type="range" min="0" max="10" step="1" value="${x.i}" data-emo="${i}" aria-label="Intensidad de ${esc(x.n)}">
      <div class="ticks"><span>0 nada</span><span>5</span><span>10 máximo</span></div></div>`).join('')}
    <h2 class="q">En el cuerpo</h2>
    <p class="hint">Lo que notaste físicamente (opcional).</p>
    <div class="chips">${FIS.map(n => `<button class="chip ${d.fis.includes(n) ? 'on' : ''}" data-act="fis" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <textarea data-f="fisTxt" rows="2" style="margin-top:8px;min-height:60px" placeholder="Otra cosa o más detalle">${esc(d.fisTxt)}</textarea>
    <h2 class="q">¿Qué hiciste?</h2>
    <p class="hint">Lo que hiciste o tuviste ganas de hacer.</p>
    <textarea data-f="cond" rows="3" style="min-height:80px" placeholder="Ej.: Me callé y me fui antes de que acabara la reunión.">${esc(d.cond)}</textarea>
    <h2 class="q">¿Qué pasó después?</h2>
    <p class="hint">Qué efecto tuvo lo que hiciste (opcional).</p>
    <label class="f" style="margin-top:0">Justo después</label>
    <textarea data-f="cp" rows="2" style="min-height:60px" placeholder="Ej.: Me alivié al salir de la sala.">${esc(d.cp)}</textarea>
    <label class="f">Más adelante <span style="font-weight:400">· horas o días después; si aún no lo sabes, déjalo: te lo recordaré pasadas 12 h</span></label>
    <textarea data-f="lp" rows="2" style="min-height:60px" placeholder="Ej.: No pude explicar los errores y al día siguiente me daba más miedo hablar con ella.">${esc(d.lp)}</textarea>`;
  }
  app.innerHTML = `<header class="top"><button class="navb" data-act="ed-close" aria-label="Cerrar">✕</button>
      <h1 style="flex:1">${ED.id ? 'Editar registro' : 'Nuevo registro'}</h1></header>
    <div class="steps">${STEPS.map(([l, n], i) => `<button data-act="ed-step" data-s="${i}" class="${i === st ? 'on' : ''} ${stepOk(i, d) ? 'ok' : ''}"><b>${l}</b>${n}</button>`).join('')}</div>
    ${body}
    <div class="edfoot"><div class="in">${st > 0 ? '<button class="btn" data-act="ed-prev">Atrás</button>' : ''}
      ${st < 2 ? '<button class="btn pri" data-act="ed-next">Siguiente</button>' : '<button class="btn pri" data-act="ed-save">Guardar registro</button>'}</div></div>`;
  const ta = app.querySelector('textarea[data-f]');
  if (ta && st < 2 && !ta.value) ta.focus();
}
function edGo(step){ ED.step = step; edChanged(); window.scrollTo(0, 0); render(); }
function saveEntry(){
  const d = ED.data;
  for (const i of [0, 1, 2]) if (!stepOk(i, d)){
    toast(['Falta la situación (A)', 'Faltan los pensamientos (B)', 'Marca al menos una emoción (C)'][i]);
    return edGo(i);
  }
  const now = Date.now();
  const e = {id: ED.id || uid(), at: d.at, a: d.a.trim(), b: d.b.trim(), emo: d.emo, fis: d.fis, fisTxt: d.fisTxt.trim(), cond: d.cond.trim(), cp: d.cp.trim(), lp: d.lp.trim(), cre: d.cre || now, upd: now};
  if (d.lpNo && !e.lp) e.lpNo = true;
  if (d.anc){ e.anc = d.anc; const r = S.anc.find(x => x.id === d.anc); if (r) r.abc = e.id; } // viene de una sesión de Anclaje
  if (ED.id){ const i = S.entries.findIndex(x => x.id === ED.id); if (i >= 0) S.entries[i] = e; else S.entries.push(e); }
  else { S.entries.push(e); S.draft = null; }
  if (!save()) return;
  const edited = !!ED.id; ED = null;
  window.scrollTo(0, 0); render(); toast(edited ? 'Cambios guardados' : 'Registro guardado');
}

/* ===================== Detalle ===================== */
function sheetEntry(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  sheet(`<h2>${dayTitle(dayKey(e.at))} · ${hhmm(e.at)}</h2><div class="sub">${longDate(e.at)}${e.anc ? ' · ⚓ desde Anclaje' : ''}</div>

/* ===================== Historial ===================== */
let FIL = {emo:null, min:0, per:'30', q:''};
function filtered(){
  const q = norm(FIL.q.trim());
  return inPeriod(sorted(), FIL.per).filter(e => {
    if (FIL.emo){ const x = e.emo.find(x => x.n === FIL.emo); if (!x || x.i < FIL.min) return false; }
    else if (maxI(e) < FIL.min) return false;
    if (q && !norm([e.a, e.b, e.cond, e.cp, e.lp, e.fisTxt, ...e.fis, ...e.emo.map(x => x.n)].join(' ')).includes(q)) return false;
    return true;
  });
}
function usedEmos(list){
  const c = {}; list.forEach(e => e.emo.forEach(x => c[x.n] = (c[x.n] || 0) + 1));
  return Object.keys(c).sort((a, b) => c[b] - c[a]);
}
function renderHistorial(){

/* ===================== Resumen ===================== */
let RES_PER = '30';
function stats(list){
  const emo = {}, fis = {}, buckets = {lo:0, mid:0, hi:0}, franja = [0, 0, 0, 0];
  for (const e of list){
    for (const x of e.emo){ const s = emo[x.n] = emo[x.n] || {n:x.n, c:0, sum:0, max:0}; s.c++; s.sum += x.i; s.max = Math.max(s.max, x.i); }
    for (const f of e.fis) fis[f] = (fis[f] || 0) + 1;
    buckets[ilvl(maxI(e))]++;
    const h = new Date(e.at).getHours(); franja[h < 6 ? 0 : h < 12 ? 1 : h < 20 ? 2 : 3]++;
  }
  const emos = Object.values(emo).sort((a, b) => b.c - a.c || b.sum / b.c - a.sum / a.c);
  const fisL = Object.entries(fis).sort((a, b) => b[1] - a[1]);
  const media = list.length ? list.reduce((a, e) => a + maxI(e), 0) / list.length : 0;
  return {n:list.length, dias:new Set(list.map(e => dayKey(e.at))).size, media, emos, fis:fisL, buckets, franja};
}
function renderResumen(){
  const list = inPeriod(S.entries, RES_PER), st = stats(list);
  const seg = `<div class="seg" style="margin-bottom:12px">${[['7','7 días'],['30','30 días'],['90','3 meses'],['all','Todo']].map(([v, l]) => `<button data-act="res-per" data-v="${v}" class="${RES_PER === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if (!st.n){
    app.innerHTML = `<header class="top">${BACK}<div class="ht"><h1>Resumen</h1></div></header>${S.entries.length ? seg : ''}<div class="empty">${S.entries.length ? 'No hay registros en este periodo.' : 'Cuando tengas algunos registros, aquí verás qué emociones aparecen más y con qué intensidad.'}</div>`;
    return;
  }
  const maxC = st.emos[0].c;
  const hb = (label, val, max, cls, right) => `<span>${label}</span><span class="bar"><i class="${cls}" style="width:${max ? Math.max(3, val / max * 100) : 0}%"></i></span><span class="r num">${right}</span>`;
  // registros por día (7 días) o por semana
  let cols = [];
  if (RES_PER === '7'){
    for (let i = 6; i >= 0; i--){ const k = addDays(dayKey(), -i); cols.push({l: 'LMXJVSD'[(keyToDate(k).getDay() + 6) % 7], c: list.filter(e => dayKey(e.at) === k).length}); }
  } else {
    const first = list.reduce((a, e) => Math.min(a, e.at), Infinity);
    const nW = RES_PER === '30' ? 5 : RES_PER === '90' ? 13 : Math.min(12, Math.floor((keyToDate(weekStart(dayKey())) - keyToDate(weekStart(dayKey(first)))) / (7 * DAY_MS)) + 1);
    const w0 = weekStart(dayKey());
    for (let i = nW - 1; i >= 0; i--){
      const ws = addDays(w0, -7 * i), we = addDays(ws, 7), d = keyToDate(ws);
      cols.push({l: d.getDate() + '/' + (d.getMonth() + 1), c: list.filter(e => { const k = dayKey(e.at); return k >= ws && k < we; }).length});
    }
  }
  const maxCol = Math.max(1, ...cols.map(c => c.c));
  const fr = ['Madrugada','Mañana','Tarde','Noche'], maxF = Math.max(...st.franja);
  app.innerHTML = `<header class="top">${BACK}<div class="ht"><h1>Resumen</h1><div class="sub">${RES_PER === 'all' ? 'Desde el primer registro' : 'Últimos ' + RES_PER + ' días'}</div></div>
      <button class="btn sm" data-act="export">Exportar</button></header>
    ${seg}
    <div class="card hero">
      <div><div class="big num">${st.n}</div><div class="lbl">registros</div></div>
      <div><div class="big num">${st.dias}</div><div class="lbl">días con registro</div></div>
      <div><div class="big num ${ilvl(st.media)}">${dec(st.media)}</div><div class="lbl">intensidad media</div></div>
    </div>
    <div class="card"><h3 class="sec" style="margin-top:0"><span>Emociones</span><span>veces · media · máx.</span></h3>
      <div class="hb">${st.emos.map(s => hb(esc(s.n), s.c, maxC, ilvl(s.sum / s.c), `${s.c} · ${dec(s.sum / s.c)} · ${s.max}`)).join('')}</div>
    </div>
    <div class="card"><h3 class="sec" style="margin-top:0"><span>Intensidad de cada registro</span></h3>
      <div class="hb">${hb('Baja (0–3)', st.buckets.lo, st.n, 'lo', st.buckets.lo)}${hb('Media (4–6)', st.buckets.mid, st.n, 'mid', st.buckets.mid)}${hb('Alta (7–10)', st.buckets.hi, st.n, 'hi', st.buckets.hi)}</div>
      <div class="muted small" style="margin-top:8px">Cuenta la emoción más intensa de cada registro.</div>
    </div>
    <div class="card"><h3 class="sec" style="margin-top:0"><span>${RES_PER === '7' ? 'Registros por día' : 'Registros por semana'}</span></h3>
      <div class="vbars">${cols.map(c => `<div><em class="num">${c.c || ''}</em><i style="height:${c.c / maxCol * 80}%"></i><span>${c.l}</span></div>`).join('')}</div>
    </div>
    <div class="card"><h3 class="sec" style="margin-top:0"><span>Momento del día</span></h3>
      <div class="hb">${fr.map((n, i) => hb(n, st.franja[i], maxF, '', st.franja[i])).join('')}</div>

      <div class="hb">${st.fis.slice(0, 8).map(([n, c]) => hb(esc(n), c, st.fis[0][1], '', c)).join('')}</div></div>` : ''}`;
}

/* ===================== Exportar para el psicólogo ===================== */
let EXP = {per: null, from:'', to:''};
function expRange(){
  const now = Date.now(), first = S.entries.reduce((a, e) => Math.min(a, e.at), now);
  switch (EXP.per){
    case 'consulta': return {from: fromDateVal(S.settings.consulta) ?? first, to: now};
    case '14': return {from: fromDateVal(addDays(dayKey(), -13)), to: now};
    case '30': return {from: fromDateVal(addDays(dayKey(), -29)), to: now};
    case 'custom': return {from: fromDateVal(EXP.from) ?? first, to: fromDateVal(EXP.to, true) ?? now};
    default: return {from: first, to: now};
  }
}
function expList(){ const {from, to} = expRange(); return S.entries.filter(e => e.at >= from && e.at <= to).sort((a, b) => a.at - b.at); }
function fileBase(){
  const {from, to} = expRange(), f = ms => dmy(ms).replace(/\//g, '-');
  return ('Registro ABC ' + (S.settings.nombre ? S.settings.nombre + ' ' : '') + f(from) + ' a ' + f(to)).replace(/[\\/:*?"<>|]/g, '');
}

    <div class="muted num" style="margin:12px 2px" id="exp-n">${n} registro${n === 1 ? '' : 's'} en este periodo</div>

function exportPDF(){
  const list = expList(); if (!list.length) return toast('No hay registros en ese periodo');
  document.getElementById('print').innerHTML = reportHtml(list);
  const t = document.title; document.title = fileBase();
  const done = () => { document.title = t; document.getElementById('print').innerHTML = ''; window.removeEventListener('afterprint', done); };

function reportText(list){
  const {from, to} = expRange(), s = S.settings;
  const lines = ['Autorregistro ABC' + (s.nombre ? ' · ' + s.nombre : ''), `Periodo: ${dmy(from)} – ${dmy(to)} · ${list.length} registros`, ...(ancLine() ? [ancLine()] : []), ''];
  for (const e of list){
    lines.push(`— ${cap(DAYS_LONG[new Date(e.at).getDay()])} ${dmy(e.at)}, ${hhmm(e.at)}`, `A · Antecedente: ${e.a}`, `B · Pensamientos: ${e.b}`, `C · Emociones: ${emoTxt(e)}`);
    if (e.fis.length || e.fisTxt) lines.push(`C · En el cuerpo: ${fisTxt(e)}`);
    if (e.cond) lines.push(`C · Qué hice: ${e.cond}`);
    if (e.cp) lines.push(`C · Justo después: ${e.cp}`);
    if (e.lp) lines.push(`C · Más adelante: ${e.lp}`);

  }
  return lines.join('\n').trim();
}
async function exportText(){
  const list = expList(); if (!list.length) return toast('No hay registros en ese periodo');
  const text = reportText(list);
  if (navigator.share){ try{ await navigator.share({title: 'Registro ABC', text}); return; }catch(e){ if (e.name === 'AbortError') return; } }
  try{ await navigator.clipboard.writeText(text); toast('Copiado: pégalo en el mensaje'); }catch(_){ toast('No se ha podido copiar'); }
}
function csvCell(v){
  v = String(v ?? '');
  if (/^[=+@\t\r]/.test(v)) v = "'" + v; // que Excel no lo tome como fórmula
  return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function exportCSV(){
  const list = expList(); if (!list.length) return toast('No hay registros en ese periodo');
  const rows = [['Fecha','Hora','A · Antecedente','B · Pensamientos','C · Emociones (0-10)','Intensidad máxima','C · En el cuerpo','C · Qué hizo','C · Justo después','C · Más adelante']]
    .concat(list.map(e => [dmy(e.at), hhmm(e.at), e.a, e.b, emoTxt(e), maxI(e), fisTxt(e), e.cond, e.cp, e.lp]));
  shareOrDownload(new Blob(['﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n')], {type:'text/csv'}), fileBase() + '.csv');
}
async function shareOrDownload(blob, name){
  const f = new File([blob], name, {type: blob.type});
  if (navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:name}); return; }catch(e){ if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('Archivo guardado en Descargas');
}

    return {ctx, g, lp};
  }catch(_){ return null; }
}
function brSound(typ, d){
  const A = BR.audio; if (!A) return;
  const t = A.ctx.currentTime, g = A.g.gain, f = A.lp.frequency;
  g.cancelScheduledValues(t); f.cancelScheduledValues(t); g.setValueAtTime(Math.max(g.value, .0001), t); f.setValueAtTime(f.value, t);
  if (typ === 'in'){ g.linearRampToValueAtTime(.5, t + d); f.exponentialRampToValueAtTime(1300, t + d); }
  else if (typ === 'in2'){ g.linearRampToValueAtTime(.6, t + d); f.exponentialRampToValueAtTime(1700, t + d); }
  else if (typ === 'out'){ g.linearRampToValueAtTime(.45, t + .3); g.linearRampToValueAtTime(.0001, t + d); f.exponentialRampToValueAtTime(240, t + d); }
  else g.linearRampToValueAtTime(.0001, t + .4);
}
async function brWake(){ try{ if ('wakeLock' in navigator && BR && !BR.ended) BR.lock = await navigator.wakeLock.request('screen'); }catch(_){} }
function brPause(){
  if (!BR || BR.ended) return;
  const btn = document.getElementById('br-pause');
  if (BR.paused == null){
    BR.paused = performance.now(); if (BR.audio) BR.audio.ctx.suspend();
    btn.textContent = 'Seguir'; brSet('br-ph', 'En pausa'); brSet('br-hint', 'toca «Seguir» cuando quieras'); document.getElementById('br-ph').style.opacity = 1;
  } else {
    BR.pausedMs += performance.now() - BR.paused; BR.paused = null; if (BR.audio) BR.audio.ctx.resume();
    btn.textContent = 'Pausa'; BR.phase = -1; // repinta el texto de la fase
  }
}
function brRecord(){
  if (!BR || BR.rec) return;
  const el = BR.ended && BR.el >= BR.total ? BR.total : ((BR.paused ?? performance.now()) - BR.t0 - BR.pausedMs) / 1000 - PREP; // al momento, no el del último fotograma
  const seg = Math.round(Math.max(0, Math.min(el, BR.total)));
  if (seg < 30) return; // menos de medio minuto no cuenta como práctica
  BR.rec = {id: uid(), at: Date.now(), tec: BR.t.id, seg, antes: BR.antes, despues: null};
  S.resp.push(BR.rec); save();
}
function brQuiet(){ // para animación, sonido y bloqueo de pantalla
  cancelAnimationFrame(BR.raf);
  if (BR.audio){ const A = BR.audio; try{ A.g.gain.cancelScheduledValues(A.ctx.currentTime); A.g.gain.setTargetAtTime(.0001, A.ctx.currentTime, .15); }catch(_){} setTimeout(() => A.ctx.close().catch(() => {}), 800); BR.audio = null; }
  if (BR.lock){ BR.lock.release().catch(() => {}); BR.lock = null; }
}
function brFinish(){
  if (!BR || BR.ended) return;
  BR.ended = true; brQuiet(); brRecord();
  if (!BR.rec){ brClose(); toast('Práctica cancelada: dura menos de medio minuto'); return; }
  brEndScreen();
}
function brEndScreen(){
  const r = BR.rec, el = document.getElementById('br');
  el.classList.remove('dim');
  el.innerHTML = `<div class="br-end"><h2 style="font-size:24px;margin:0 0 4px">Bien hecho</h2>
    <div class="muted">Has practicado ${Math.max(1, Math.round(r.seg / 60))} min de ${BR.t.n.toLowerCase()}.</div>
    <label class="f" style="margin-top:22px">¿Y ahora, cuánta tensión notas? <span style="font-weight:400">(opcional)</span></label>
    ${scaleHtml('br-despues', '', BR.despues)}
    ${BR.antes != null ? `<div class="muted small num" style="margin-top:8px">Antes: ${BR.antes}${BR.despues != null ? ` · ahora: <b>${BR.despues}</b>` : ''}</div>` : ''}
    <div class="actions" style="margin-top:20px"><button class="btn" data-act="br-again">Repetir</button><button class="btn pri" data-act="br-done">Hecho</button></div></div>`;
}
function brClose(){ // quita la sesión de la pantalla y del historial
  if (!BR) return;
  if (!BR.ended){ BR.ended = true; brQuiet(); }
  document.getElementById('br')?.remove(); BR = null;
  if (history.state && history.state.br) history.back(); else render();
}
function brStop(){ // Atrás del móvil durante la sesión (el historial ya ha vuelto)
  if (!BR) return;
  if (!BR.ended){ BR.ended = true; brQuiet(); brRecord(); }
  document.getElementById('br')?.remove(); BR = null;
}
document.addEventListener('visibilitychange', () => {
  if (!BR || BR.ended) return;
  if (document.hidden){ if (BR.paused == null) brPause(); }
  else brWake(); // el bloqueo de pantalla se suelta al salir de la app
});

/* ===================== Anclaje ===================== */
// No busca calmar: sirve para mantenerse en pie mientras el malestar está y elegir qué hacer.
// Ningún texto promete que la emoción se vaya, y por eso aquí no se mide la tensión antes y después.
// Solo texto: cada frase se lee letra a letra, con una ola de zoom que pasa de izquierda a derecha.
// Una sesión: {id, at (ms), modo ('real' | 'sim'), seg, fin (llegó al final), hacer, abc (id del registro enlazado o null)}
const AN_DEF = 'la alarma';
const AN_SUG = ['la alarma', 'la tormenta', 'la ola', 'el nudo', 'el ruido', 'la visita', 'el pasajero'];
const AN_PASOS = [
  {t:'Nota y nombra', f:['Ahí está {n}.', '¿En qué parte del cuerpo se nota?', 'Si aparece una frase, di por dentro: estoy teniendo el pensamiento de que…']},
  {t:'Conecta con el cuerpo', f:['Pies en el suelo.', 'Peso en la silla.', 'Suelta el aire despacio, más largo de lo que lo coges.']},
  {t:'Vuelve a lo que haces', f:['{N} puede seguir aquí.', 'Mira dónde estás y con quién.', 'Si {n} no existiera ahora mismo, ¿qué estarías haciendo?']},
];
const AN_SIM = 'Esto es un ensayo. Imagina que {n} acaba de aparecer.';
const AN_LETRA = 65;          // ms por letra: el ritmo de una lectura tranquila (unas 150 palabras por minuto)
const AN_HOLD = 1400;         // ms con la frase ya completa antes de pasar a la siguiente
const AN_GAP = 7, AN_GAP_FIN = 3; // segundos de silencio tras cada frase y tras la última
let AN = null;      // sesión en marcha
let AFTER = null;   // lo que hay que hacer cuando el historial termine de volver (ver popstate)
const anN = () => S.settings.anc.nombre || AN_DEF;
const anTxt = x => x.replace('{n}', anN()).replace('{N}', cap(anN()));
const anPie = () => `<div class="an-pie">No es para que ${esc(anN())} se vaya. Es para que no decida por ti.</div>`;
function anClean(v){ // «La alarma» → «la alarma», para que encaje en mitad de una frase; los nombres propios se quedan como están
  v = String(v || '').trim().replace(/\s+/g, ' ').slice(0, 30);
  return /^(El|La|Los|Las|Mi|Mis|Un|Una|Ese|Esa|Eso|Este|Esta|Esto)\s/.test(v) ? v[0].toLowerCase() + v.slice(1) : v;
}

function renderAnclaje(){
  const a = S.settings.anc, k = dayKey(), week = S.anc.filter(r => dayKey(r.at) >= addDays(k, -6)).sort((x, y) => y.at - x.at);
  const re = week.filter(r => r.modo === 'real').length;
  app.innerHTML = `<header class="top">${BACK}<div class="ht"><h1>Anclaje</h1><div class="sub">Para cuando aprieta</div></div></header>
    <div class="card"><b>No busca calmarte ni que el malestar desaparezca.</b> Sirve para mantenerte en pie mientras está y elegir qué hacer.
      <div class="muted small" style="margin-top:8px">¿Lo que quieres es bajar la tensión? Para eso está la <button class="linkb" data-act="go" data-to="respirar">Respiración guiada</button>.</div></div>
    <button class="btn pri big" data-act="an-start" data-m="real">Ahora lo necesito</button>
    <button class="btn big an-sim" data-act="an-start" data-m="sim"><b>Simulacro</b><span>Práctica diaria en calma, para entrenarlo antes de necesitarlo</span></button>
    <div class="card" style="margin-top:12px">
      <div class="row" style="justify-content:space-between"><span>${a.nombre ? 'Lo llamas' : 'Aún sin nombre. Se usará'} <b>«${esc(anN())}»</b></span>
        <button class="btn sm" data-act="an-nom">${a.nombre ? 'Cambiar' : 'Ponerle nombre'}</button></div>
      ${a.nombre ? '' : '<div class="muted small" style="margin-top:6px">Ponerle nombre ayuda a verlo desde fuera.</div>'}
      <div class="chips" style="margin-top:12px">${navigator.vibrate ? `<button class="chip ${a.vib ? 'on' : ''}" data-act="an-vib">📳 Vibración</button>` : ''}</div>
    </div>
    <details class="card"><summary>¿Cómo es la sesión?</summary>
      <ol class="small" style="margin:10px 0 0;padding-left:20px;display:grid;gap:6px">${AN_PASOS.map(p => `<li><b>${p.t}.</b> ${esc(p.f.map(anTxt).join(' '))}</li>`).join('')}</ol>
      <div class="muted small" style="margin-top:10px">Dura en torno a un minuto y medio, con pausas entre frases. Solo texto, sin voz.</div></details>
    ${week.length ? `<h3 class="sec"><span>Últimos 7 días</span></h3>
      <div class="card hero">
        <div><div class="big num">${re}</div><div class="lbl">en un momento real</div></div>
        <div><div class="big num">${week.length - re}</div><div class="lbl">simulacro${week.length - re === 1 ? '' : 's'}</div></div>
        <div><div class="big num">${new Set(week.map(r => dayKey(r.at))).size}</div><div class="lbl">días</div></div>
      </div>
      <div class="card" style="padding:4px 14px">${week.slice(0, 6).map(r => `<div class="rrow"><span>${dayTitle(dayKey(r.at))} · ${hhmm(r.at)}</span><span>${r.modo === 'sim' ? 'Simulacro' : 'Momento real'}${r.hacer ? ` · <b>${esc(r.hacer.length > 60 ? r.hacer.slice(0, 60) + '…' : r.hacer)}</b>` : ''}</span></div>`).join('')}</div>` : ''}
    ${anPie()}${CRISIS}`;
}
function sheetAnNombre(modo){ // modo: si viene de «Simulacro» la primera vez, al cerrar empieza la sesión
  const a = S.settings.anc, m = modo ? ` data-m="${modo}"` : '';
  sheet(`<h2>¿Cómo lo llamas?</h2><div class="sub">Eso que te aparece cuando hay ansiedad, enfado o malestar intenso. Ponerle nombre ayuda a verlo desde fuera.</div>
    <div class="chips" style="margin-top:10px">${AN_SUG.map(n => `<button class="chip ${a.nombre === n ? 'on' : ''}" data-act="an-sug" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
    <label class="f">O escribe el tuyo</label>
    <input id="an-nom" maxlength="30" autocomplete="off" value="${esc(a.nombre)}" placeholder="Una palabra, un personaje, un nombre propio">
    <div class="muted small" style="margin-top:8px">Escríbelo como lo dirías en una frase: «la alarma», «el pesado de Paco», «Paco». Mejor un nombre curioso o neutro que uno de enemigo: no se trata de pelear con ello.</div>
    <div class="actions"><button class="btn ghost" data-act="an-nom-no"${m}>${a.nombre ? 'Cancelar' : `Usar «${AN_DEF}»`}</button><button class="btn pri" data-act="an-nom-ok"${m}>Guardar</button></div>
    <div class="muted small" style="margin-top:12px">Puedes cambiarlo cuando quieras.</div>`);
}
function anNomSet(v, modo){
  const a = S.settings.anc, antes = a.nombre;
  if (v != null) a.nombre = anClean(v);
  a.preg = true; save(); closeSheet(); render();
  if (modo) anStart(modo);
  else if (v != null && a.nombre !== antes) toast(`Ahora se llama «${anN()}»`);
}

function anStart(modo){
  closeSheet();
  const a = S.settings.anc, seq = modo === 'sim' ? [{p:-1, x:AN_SIM}] : [];
  AN_PASOS.forEach((s, i) => s.f.forEach(x => seq.push({p:i, x})));
  AN = {modo, seq, i:-1, at:Date.now(), pAt:null, pausedMs:0, tok:0, tm:[], lock:null, ended:false, rec:null, conf:false,
    vib: !!navigator.vibrate && a.vib};
  if (!(history.state && history.state.an)) history.pushState({app:1, an:1}, '', '#anclaje'); // Atrás cierra la sesión
  const el = document.createElement('div'); el.id = 'an'; el.className = 'br';
  el.innerHTML = `<div class="br-top"><span class="t">${modo === 'sim' ? 'Simulacro' : 'Anclaje'}</span><button class="btn sm ghost" data-act="an-stop">Terminar</button></div>
    <div class="an-stage"><div class="an-dots">${AN_PASOS.map((_, i) => `<i id="an-d${i}"></i>`).join('')}</div>
      <div class="an-paso" id="an-paso"></div><div class="an-fr" id="an-fr" aria-live="polite"></div></div>
    <div class="br-bot"><button class="btn" data-act="an-pause" id="an-pause">Pausa</button>${anPie()}</div>`;
  document.body.appendChild(el);
  anWake(); anNext();
}
function anNext(){
  if (!AN || AN.ended) return;
  if (++AN.i >= AN.seq.length) return anFinish(true);
  anSay();
}
function anSay(){ // la frase se lee letra a letra (una ola de zoom de izquierda a derecha) y, al acabar, queda un silencio antes de la siguiente
  const it = AN.seq[AN.i], txt = anTxt(it.x), tok = ++AN.tok, last = AN.i === AN.seq.length - 1;
  document.getElementById('an-paso').textContent = it.p < 0 ? 'Antes de empezar' : `Paso ${it.p + 1} de ${AN_PASOS.length} · ${AN_PASOS[it.p].t}`;
  AN_PASOS.forEach((_, i) => document.getElementById('an-d' + i).classList.toggle('on', i <= it.p));
  const fr = document.getElementById('an-fr'); let k = 0;
  fr.setAttribute('aria-label', txt); // para lectores de pantalla, la frase entera y no letra a letra
  fr.innerHTML = txt.split(' ').map((w, i) => (i ? (k++, ' ') : '') + `<span class="w" aria-hidden="true">${[...w].map(c => `<span class="ch" style="animation-delay:${k++ * AN_LETRA}ms">${esc(c)}</span>`).join('')}</span>`).join('');
  if (AN.vib) navigator.vibrate(20);
  const later = (fn, s) => AN.tm.push(setTimeout(() => { if (AN && AN.tok === tok && !AN.ended) fn(); }, s * 1000));
  later(() => later(anNext, last ? AN_GAP_FIN : AN_GAP), (txt.length * AN_LETRA + AN_HOLD) / 1000);
}
function anHush(){ // corta lo que estuviera programado
  AN.tok++; AN.tm.forEach(clearTimeout); AN.tm = [];
}
async function anWake(){ try{ if ('wakeLock' in navigator && AN && !AN.ended) AN.lock = await navigator.wakeLock.request('screen'); }catch(_){} }
function anPause(){
  if (!AN || AN.ended) return;
  const btn = document.getElementById('an-pause');
  if (AN.pAt == null){ AN.pAt = Date.now(); anHush(); btn.textContent = 'Seguir'; }
  else { AN.pausedMs += Date.now() - AN.pAt; AN.pAt = null; btn.textContent = 'Pausa'; anSay(); } // vuelve a leer la frase en la que estaba
}
function anQuiet(){ anHush(); if (AN.lock){ AN.lock.release().catch(() => {}); AN.lock = null; } }
function anRecord(done){ // cuenta si se llegó al final o, al menos, al segundo paso
  const it = AN.seq[Math.min(Math.max(0, AN.i), AN.seq.length - 1)];
  if (AN.rec || !(done || it.p >= 1)) return;
  const seg = Math.max(0, Math.round(((AN.pAt ?? Date.now()) - AN.at - AN.pausedMs) / 1000));
  AN.rec = {id: uid(), at: AN.at, modo: AN.modo, seg, fin: !!done, hacer: '', abc: null};
  S.anc.push(AN.rec); save();
}
function anFinish(done){
  if (!AN || AN.ended) return;
  AN.ended = true; anQuiet(); anRecord(done);
  if (AN.rec) anEndScreen(); else anClose();
}
function anEndScreen(){
  document.getElementById('an').innerHTML = `<div class="br-end"><h2 style="font-size:24px;margin:0 0 4px">¿Qué quieres hacer ahora?</h2>
    <div class="muted">Algo pequeño que vaya en la dirección de esa pregunta vale. Si no quieres escribir nada, toca «Hecho».</div>
    <textarea id="an-hacer" rows="3" maxlength="500" style="margin-top:14px;min-height:96px" placeholder="Ej.: Llamar a mi hermana.">${esc(AN.rec.hacer)}</textarea>
    ${AN.conf ? `<div class="note">Ya tienes un registro ABC a medias. ¿Lo añado a ese?</div>
        <div class="actions"><button class="btn" data-act="an-abc-solo">Dejarlo solo aquí</button><button class="btn pri" data-act="an-abc-add">Añadirlo</button></div>`
      : `<div class="actions" style="margin-top:14px"><button class="btn" data-act="an-abc">Guardar en el registro ABC</button><button class="btn pri" data-act="an-done">Hecho</button></div>`}
    ${anPie()}</div>`;
}
function anHacer(){ // guarda lo escrito en la sesión
  const t = document.getElementById('an-hacer');
  if (t && AN && AN.rec){ AN.rec.hacer = t.value.trim(); save(); }
  return t;
}
function anDone(){
  anHacer();
  const ask = !S.settings.anc.nombre && !S.settings.anc.preg; // tras la primera vez, invita a ponerle nombre
  anClose(ask ? () => sheetAnNombre(null) : null);
}
function anToAbc(mode){ // lo escrito pasa al registro ABC como registro a medias (el ABC pide antecedente, pensamiento y emoción)
  const t = anHacer(), r = AN.rec;
  if (!r.hacer){ t.placeholder = 'Escribe aquí qué quieres hacer para poder guardarlo'; return t.focus(); }
  const has = S.draft && !isBlank(S.draft.data);
  if (has && !mode){ AN.conf = true; return anEndScreen(); }
  if (mode === 'solo') return anClose();
  if (has){ const d = S.draft.data; d.cond = (d.cond.trim() ? d.cond.trim() + '\n' : '') + r.hacer; if (!d.anc) d.anc = r.id; }
  else S.draft = {id: null, step: 0, data: {...blank(), cond: r.hacer, anc: r.id}};
  save();
  anClose(() => toast(has ? 'Añadido a tu registro a medias' : 'Guardado como registro a medias: complétalo cuando puedas'));
}
function anClose(after){ // quita la sesión de la pantalla y del historial
  if (!AN) return;
  if (!AN.ended){ AN.ended = true; anQuiet(); }
  document.getElementById('an')?.remove(); AN = null;
  if (history.state && history.state.an){ AFTER = after || null; history.back(); }
  else { render(); if (after) after(); }
}
function anStop(){ // Atrás del móvil durante la sesión (el historial ya ha vuelto)
  if (!AN) return;
  if (!AN.ended){ AN.ended = true; anQuiet(); anRecord(false); } else anHacer();
  document.getElementById('an')?.remove(); AN = null;
}
document.addEventListener('visibilitychange', () => {
  if (!AN || AN.ended) return;
  if (document.hidden){ if (AN.pAt == null) anPause(); }
  else anWake();
});

/* ===================== Acciones ===================== */
const ACT = {
  'go': b => go(b.dataset.to),
  'back': goBack,
  'br-open': b => { if (!b.dataset.keep) BRPRE = null; sheetBr(b.dataset.id); },
  'br-dur': b => { S.settings.resp.dur[b.dataset.id] = +b.dataset.v; save(); keepScroll(render); sheetBr(b.dataset.id); },
  'br-rit': b => { S.settings.resp.ritmo[b.dataset.id] = +b.dataset.v; save(); keepScroll(render); sheetBr(b.dataset.id); },
  'br-son': b => { const t = TEC(b.dataset.id); S.settings.resp.son[t.id] = !sonOf(t); save(); sheetBr(t.id); },
  'br-vib': b => { S.settings.resp.vib = !S.settings.resp.vib; save(); sheetBr(b.dataset.id); },
  'br-antes': b => { BRPRE = BRPRE === +b.dataset.v ? null : +b.dataset.v; sheetBr(b.dataset.id); },
  'br-info': b => sheetBrInfo(b.dataset.id),
  'br-start': b => brStart(b.dataset.id),
  'br-pause': brPause,
  'br-stop': brFinish,
  'br-despues': b => {
    BR.despues = BR.despues === +b.dataset.v ? null : +b.dataset.v;
    if (BR.rec){ BR.rec.despues = BR.despues; save(); }
    brEndScreen();
  },
  'br-again': () => { const id = BR.t.id, d = BR.despues; document.getElementById('br')?.remove(); BR = null; BRPRE = d; brStart(id); },
  'br-done': () => { const a = BR.antes, d = BR.despues; brClose(); if (a != null && d != null) toast(`Tensión: ${a} → ${d}`); },
  'an-start': b => { const m = b.dataset.m; if (m === 'sim' && !S.settings.anc.nombre && !S.settings.anc.preg) return sheetAnNombre(m); anStart(m); },
  'an-nom': () => sheetAnNombre(null),
  'an-sug': b => { document.getElementById('an-nom').value = b.dataset.n; b.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); },
  'an-nom-ok': b => anNomSet(document.getElementById('an-nom').value, b.dataset.m),
  'an-nom-no': b => anNomSet(null, b.dataset.m),
  'an-vib': () => { S.settings.anc.vib = !S.settings.anc.vib; save(); keepScroll(render); },
  'an-pause': anPause,
  'an-stop': () => anFinish(false),
  'an-done': anDone,
  'an-abc': () => anToAbc(null),
  'an-abc-add': () => anToAbc('add'),
  'an-abc-solo': () => anToAbc('solo'),
  'new': () => openEditor(null),
  'discard': () => { const d = S.draft; S.draft = null; save(); render(); toast('Borrador descartado', () => { S.draft = d; save(); render(); }); },
  'ed-close': closeEditor,
  'ed-step': b => edGo(+b.dataset.s),
  'ed-prev': () => edGo(ED.step - 1),
  'ed-next': () => edGo(ED.step + 1),
  'ed-save': saveEntry,
  'emo': b => {
    const n = b.dataset.n, i = ED.data.emo.findIndex(x => x.n === n);
    if (i >= 0) ED.data.emo.splice(i, 1); else ED.data.emo.push({n, i:5});
    edChanged(); keepScroll(render);
  },
  'emo-add': () => {
    const inp = document.getElementById('ed-otra'), n = inp.value.trim().replace(/\s+/g, ' ');
    if (!n) return inp.focus();
    const name = cap(n);
    if (!ED.data.emo.some(x => norm(x.n) === norm(name))) ED.data.emo.push({n: EMOS.find(x => norm(x) === norm(name)) || name, i:5});
    edChanged(); keepScroll(render);
  },
  'fis': b => {
    const n = b.dataset.n, i = ED.data.fis.indexOf(n);
    if (i >= 0) ED.data.fis.splice(i, 1); else ED.data.fis.push(n);
    edChanged(); keepScroll(render);
  },
  'open': b => sheetEntry(b.dataset.id),
  'edit': b => openEditor(b.dataset.id),
  'del': b => delEntry(b.dataset.id),
  'lp': b => sheetLp(b.dataset.id),
  'lp-save': b => {
    const v = document.getElementById('lp-txt').value.trim();
    if (!v) return toast('Escribe qué pasó o toca «Nada que añadir»');
    lpSet(b.dataset.id, {lp: v}, 'Registro completado');
  },
  'lp-no': b => lpSet(b.dataset.id, {lpNo: true}, 'Hecho: ya no te lo recordaré'),
  'fil-per': b => { FIL.per = b.dataset.v; renderHistorial(); },
  'fil-emo': b => { FIL.emo = b.dataset.n || null; renderHistorial(); },
  'fil-min': b => { FIL.min = +b.dataset.v; renderHistorial(); },
  'fil-clear': () => { FIL = {emo:null, min:0, per:'all', q:''}; renderHistorial(); },
  'res-per': b => { RES_PER = b.dataset.v; renderResumen(); },
  'theme': b => { S.settings.theme = b.dataset.v; save(); applyTheme(); renderAjustes(); },
  'export': sheetExport,
  'exp-per': b => { EXP.per = b.dataset.v; sheetExport(); },
  'exp-pdf': exportPDF,
  'exp-txt': exportText,
  'exp-csv': exportCSV,
  'bk-export': backupExport,
  'wipe': sheetWipe,
  'wipe-yes': () => { S = structuredClone(DEFAULTS); save(); applyTheme(); closeSheet(); ED = null; history.replaceState(null, '', '#inicio'); routeFromHash(); render(); toast('Datos borrados'); },
  'sheet-close': closeSheet,
};
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f){ e.preventDefault(); f(b, e); }
});
// Lo que se escribe en el editor se guarda al momento como borrador (sin repintar, para no perder el foco)
app.addEventListener('input', e => {
  if (!ED) return;
  const t = e.target;
  if (t.dataset.f){ ED.data[t.dataset.f] = t.value; edChanged(); }
  else if (t.dataset.emo != null){
    const i = +t.dataset.emo, v = +t.value; ED.data.emo[i].i = v; edChanged();
    const lab = document.getElementById('ev' + i); lab.textContent = v; lab.className = 'v num ' + ilvl(v);
  }
});
app.addEventListener('change', e => {
  if (ED && e.target.id === 'ed-at'){ const t = fromLocalInput(e.target.value); if (t){ ED.data.at = t; edChanged(); } }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ed-otra'){ e.preventDefault(); ACT['emo-add'](); } });

// El día cambia a las 05:00: al volver a la app se repinta «Hoy»
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !ED && !BR && !AN && !document.querySelector('.sheet') && (VIEW === 'inicio' || (VIEW === 'abc' && TAB === 'registrar'))) render();
});
routeFromHash();
applyTheme();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
